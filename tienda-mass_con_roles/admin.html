<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de administración — Tienda Mass</title>
  <link rel="stylesheet" href="estilos.css?v=2">
  <link rel="stylesheet" href="mejoras.css">
  <script src="datos.js" defer></script>
  <script src="catalogo.js" defer></script>
  <script src="app.js" defer></script>
  <script src="cuentas.js" defer></script>
</head>
<body data-page="admin">

<!-- Menú de navegación global (los enlaces de sesión los agrega datos.js) -->
<header class="encabezado">
  <nav class="barra-nav">
    <a href="index.html" class="marca" style="text-shadow: 3px 3px 0px var(--mass-amarillo); text-decoration:none; font-weight:900;">TIENDA MASS</a>
    <button type="button" class="menu-toggle" aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="menuPrincipal">☰</button>
    <ul id="menuPrincipal" class="nav-enlaces">
      <li><a href="index.html">Acerca de nosotros</a></li>
      <li><a href="productos.html">Productos y servicios</a></li>
      <li><a href="registro.html">Trabaja con nosotros</a></li>
      <li><a href="encuesta.html">Encuesta</a></li>
    </ul>
  </nav>
</header>

<main class="cuenta-wrap ancho">
  <div class="cabecera-amarilla"><h1 id="hola">Panel de administración</h1><span class="rol-badge">Rol: Administrador</span></div>
  <div class="cuenta-card" id="admin">
    <div class="tabs" role="tablist">
      <button type="button" class="tab-btn" data-tab="resumen" role="tab">Resumen</button>
      <button type="button" class="tab-btn" data-tab="pedidos" role="tab">Pedidos <span class="cont" id="cPed" hidden>0</span></button>
      <button type="button" class="tab-btn" data-tab="productos" role="tab">Productos</button>
      <button type="button" class="tab-btn" data-tab="mensajes" role="tab">Chat y mensajes <span class="cont" id="cMsg" hidden>0</span></button>
      <button type="button" class="tab-btn" data-tab="usuarios" role="tab">Usuarios y roles</button>
      <button type="button" class="tab-btn" data-tab="formularios" role="tab">Encuestas y solicitudes</button>
    </div>
    <section class="panel-tab" id="tab-resumen"></section>
    <section class="panel-tab" id="tab-pedidos" hidden></section>
    <section class="panel-tab" id="tab-productos" hidden></section>
    <section class="panel-tab" id="tab-mensajes" hidden></section>
    <section class="panel-tab" id="tab-usuarios" hidden></section>
    <section class="panel-tab" id="tab-formularios" hidden></section>
  </div>
</main>
</body>
</html>
