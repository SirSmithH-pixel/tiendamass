<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta de Satisfacción - Tiendas Mass</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* =========================================
        1. VARIABLES GLOBALES Y CUERPO
    ========================================= */
    :root {
      --mass-amarillo: #FFD100;
      --mass-amarillo-claro: #FFF7CC;
      --mass-azul: #0033A0;
      --mass-blanco: #FFFFFF;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      color: var(--mass-azul);
      background-color: #f8f9fa;
    }

    /* =========================================
        2. USO DE LAYOUTS (FLEXBOX Y GRID)
    ========================================= */
    .barra-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background-color: var(--mass-blanco);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .nav-enlaces {
      display: flex;
      gap: 20px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    /* =========================================
        3. USO DE 4 TRANSICIONES
    ========================================= */
    /* Transición 1: Enlaces del menú */
    .nav-enlaces a {
      text-decoration: none;
      color: var(--mass-azul);
      font-weight: bold;
      transition: color 0.3s ease, transform 0.3s ease;
    }
    .nav-enlaces a:hover {
      color: #d6b000;
      transform: scale(1.1);
    }

    /* Transición 2: Botones */
    .btn-mass {
      background-color: var(--mass-amarillo);
      color: var(--mass-azul);
      border: none;
      font-weight: bold;
      transition: background-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
    }
    .btn-mass:hover {
      background-color: #ebd600;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transform: translateY(-2px);
    }

    /* Transición 3: Entradas de formularios (inputs y selects) */
    .form-control, .form-select {
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--mass-azul);
      box-shadow: 0 0 8px rgba(0, 51, 160, 0.4);
    }

    /* Transición 4: Tarjeta principal */
    .main-card {
      background-color: #ffffff;
      border-radius: 6px;
      overflow: hidden;
      max-width: 850px;
      margin: 0 auto;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .main-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    }

    /* =========================================
        4. USO DE 2 ANIMACIONES
    ========================================= */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .seccion {
      animation: fadeInUp 0.8s ease-out forwards;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
    .header-yellow h3 {
      animation: pulse 2.5s infinite;
    }

    /* =========================================
        5. ESTILOS ESPECÍFICOS
    ========================================= */
    .header-yellow { background-color: var(--mass-amarillo); color: var(--mass-azul); padding: 18px; text-align: center; }
    .form-label { color: #333333; font-size: 0.92rem; }
    .text-asterisk { color: #dc3545; }

    /* =========================================
        6. DISEÑO RESPONSIVO (3 Dispositivos)
    ========================================= */
    @media (max-width: 991px) {
      .main-card { margin: 0 15px; }
      .header-yellow h3 { font-size: 1.5rem; }
    }

    @media (max-width: 767px) {
      .barra-nav { flex-direction: column; text-align: center; gap: 15px; }
      .nav-enlaces { flex-direction: column; width: 100%; gap: 10px; }
      .main-card { margin: 0 10px; }
      .header-yellow h3 { font-size: 1.25rem; }
    }
  </style>
  <link rel="stylesheet" href="mejoras.css">
  <script src="datos.js" defer></script>
  <script src="app.js" defer></script>
</head>

<!-- Contenedor principal con animación de entrada -->
<div class="container my-5 seccion">
  <div class="main-card shadow-lg">
    <!-- Encabezado Amarillo -->
    <div class="header-yellow">
      <h3 class="fw-bold mb-0">Encuesta de Satisfacción - Tiendas Mass</h3>
    </div>
    
    <!-- Cuerpo del Formulario -->
    <div class="p-4 p-md-5">
      <p class="small text-muted mb-4 fw-semibold">
        Los campos marcados con asterisco (<span class="text-asterisk">*</span>) son obligatorios.
      </p>
      
      <form id="formEncuesta" novalidate>
        <!-- Progreso de la encuesta (se actualiza con JavaScript) -->
        <div class="progreso">
          <div class="progreso-info"><span id="progTexto"></span><span id="progPct">0%</span></div>
          <div class="progreso-barra" id="progBarra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progreso de la encuesta">

          </div>
        </div>
        <div class="row g-3">
          <!-- P1 -->
          <div class="col-12 col-md-6">
            <label class="form-label fw-semibold">1. ¿Con qué frecuencia visita Tienda Mass? <span class="text-asterisk">*</span></label>

              <option selected disabled>Seleccionar...</option>
              <option value="diario">Diario</option>
              <option value="interdiario">Interdiario (2-3 veces por semana)</option>
              <option value="semanal">Semanal</option>
              <option value="quincenal">Quincenal o Mensual</option>
            </select>
          </div>
          <!-- P2 -->
          <div class="col-12 col-md-6">
            <label class="form-label fw-semibold d-block">2. ¿Motivo principal es la cercanía de Tienda Mass? <span class="text-asterisk">*</span></label>
            <div class="pt-1">
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="p2" id="p2_si">
                <label class="form-check-label" for="p2_si">Sí, está cerca</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="p2" id="p2_no">
                <label class="form-check-label" for="p2_no">No, voy por otros motivos</label>
              </div>
            </div>
          </div>
          <!-- P3 -->
          <div class="col-12 col-md-6">
            <label class="form-label fw-semibold">3. ¿Precios frente a otras bodegas? <span class="text-asterisk">*</span></label>
            <select class="form-select">
              <option value="" selected disabled>Seleccionar...</option>
              <option value="mucho_mas_barato">Mucho más económicos</option>
              <option value="ligeramente_barato">Ligeramente más baratos</option>
              <option value="igual">Igual de precios</option>
              <option value="mas_caro">Más caros</option>
            </select>
          </div>
          <!-- P4 -->

            <label class="form-label fw-semibold d-block">4. ¿Encuentra siempre stock? <span class="text-asterisk">*</span></label>

              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="p4" id="p4_si">
                <label class="form-check-label" for="p4_si">Siempre</label>
              </div>
              <div class="form-check form-check-inline">

                <label class="form-check-label" for="p4_aveces">A veces</label>
              </div>

                <input class="form-check-input" type="radio" name="p4" id="p4_rara">
                <label class="form-check-label" for="p4_rara">Rara vez</label>
              </div>
            </div>
          </div>
          <!-- P5 -->

          <!-- P8 -->
